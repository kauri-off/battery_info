name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Shellcheck
        run: shellcheck -x module/*.sh module/scripts/*.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Android's sh is mksh and the installer runs under busybox.
      - name: Module scripts under other shells
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mksh busybox
          for shell in bash mksh "busybox sh"; do
            echo "::group::$shell"
            TEST_SH="$shell" npx vitest run test/
            echo "::endgroup::"
          done

      - name: Build module zip
        run: npm run build

      # A version bump without a rebuild would leave update.json advertising the old one.
      - name: Auto-update manifest is in sync with module.prop
        run: git diff --exit-code docs/update.json docs/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: battery_info-zip
          path: dist/battery_info.zip
          if-no-files-found: error
