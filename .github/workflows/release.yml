name: Release

# Push a tag `vX.Y.Z` matching module.prop: this builds the zip and publishes it
# at the URL docs/update.json already points to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches module.prop version
        run: |
          prop="$(grep '^version=' module/module.prop | cut -d= -f2)"
          if [ "$prop" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != module.prop version ${prop}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build module zip
        run: npm run build

      - name: Release notes for this version
        run: |
          awk -v heading="## ${GITHUB_REF_NAME}" '
            $0 == heading { on = 1; next }
            /^## / { on = 0 }
            on
          ' docs/CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/battery_info.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
